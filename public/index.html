<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>k9s-web | Kubernetes リソース</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><aside>
<a class="brand" href="/">⎈ <span>k9s<span class="accent">-web</span></span></a><p class="caption">KUBERNETES EXPLORER</p>
<div class="connection"><div id="mode" class="pill">ローカル / 閲覧専用</div><button id="load">接続設定を読み込む</button><label for="context">Context</label><select id="context" disabled><option value="">未選択</option></select><div class="buttons"><button id="connect" class="primary" disabled>接続する</button><button id="disconnect" disabled>切断</button></div><p id="connection-status" role="status">未接続</p></div>
<p class="caption">RESOURCES</p><nav aria-label="リソース種別"><button data-kind="pods" aria-current="page">◈ <span>Pods</span></button><button data-kind="deployments">▣ <span>Deployments</span></button><button data-kind="services">⇄ <span>Services</span></button><button data-kind="ingresses">↳ <span>Ingresses</span></button></nav><p class="sidebar-note">ローカル接続・閲覧専用<br>更新 / 削除操作はありません</p>
</aside><main><header><div><p class="caption">ワークロードをひと目で</p><h1 id="title">Pods</h1><p id="scope">Contextを選択して接続してください</p></div><div class="toolbar"><label class="checkbox"><input type="checkbox" id="auto">10秒ごとに更新</label><button id="refresh" disabled>↻ 手動更新</button></div></header>
<section class="filters" aria-label="絞り込み"><div><label for="namespace">Namespace</label><select id="namespace" disabled><option value="">すべてのNamespace</option><option value="__manual">名前を直接入力…</option></select></div><form id="namespace-form" hidden><label for="namespace-input">Namespace名</label><div class="buttons"><input id="namespace-input" placeholder="例: default" autocomplete="off"><button type="submit">適用</button></div></form><div class="search"><label for="search">検索</label><input id="search" type="search" placeholder="名前・Namespace・ホスト名で検索"></div></section>
<p id="namespace-status" class="muted" role="status"></p><p id="error" class="error" role="alert" hidden></p>
<section class="resource-panel"><div class="panel-heading"><h2>リソース一覧 <span id="count" class="count">0</span></h2><span id="updated" class="muted">未取得</span></div><div class="table-wrap"><table><thead><tr><th>名前</th><th>Namespace</th><th>状態</th><th id="extra-heading">Ready / 再起動</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty">接続するとリソースが表示されます</p><button id="more" hidden>続きを読み込む</button></section>
<section id="detail" class="resource-panel" hidden><div class="panel-heading"><div><p id="detail-kind" class="caption"></p><h2 id="detail-name"></h2></div><button id="close-detail" aria-label="詳細を閉じる">閉じる ×</button></div><pre id="summary"></pre><div id="config-panel" hidden><div class="detail-toolbar"><h3>設定</h3><div class="buttons"><label for="format">表示形式</label><select id="format"><option value="yaml">YAML</option><option value="json">JSON</option></select><button id="config-refresh">設定を更新</button></div></div><p id="config-status" role="status" class="muted"></p><pre id="config-output" tabindex="0"></pre></div><div id="log-panel" hidden><div class="detail-toolbar"><h3>コンテナログ</h3><div class="buttons"><label for="container">コンテナ</label><select id="container"></select><label class="checkbox"><input type="checkbox" id="previous">前回起動時</label><button id="log-refresh">ログを更新</button></div></div><p id="log-status" role="status" class="muted"></p><pre id="log-output" tabindex="0"></pre><p class="muted">最新300行・最大1 MiB</p></div></section>
<footer>k9s-web <span>ローカル Kubernetes リソースビューア</span></footer></main></body></html>
